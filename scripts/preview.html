<!doctype html><meta charset="utf-8"><title>README preview</title>
<style>
html,body{margin:0;min-height:100%;font:16px/1.5 -apple-system,Segoe UI,sans-serif}
body.d{background:#0d1117;color:#e6edf3}body.l{background:#fff;color:#1f2328}
.md{width:var(--w,846px);margin:0 auto;padding:24px 0}
.md img{max-width:100%;box-sizing:border-box;vertical-align:middle}
.md p,.md details,.md>img,.md>a{margin:0 0 16px}.md>img,.md>a{display:block}
.md a{color:#4493f8}table{border-collapse:collapse}td,th{border:1px solid #3d444d;padding:6px 13px}
</style>
<body><div class="md" id="md"></div>
<script>
// Rough stand-in for GitHub's renderer: the README is nearly all HTML already.
// ?bg=l|d  ?w=<column px>  ?y=<scroll offset>  ?s=<comma list of assets to show alone>
const q=new URLSearchParams(location.search);
document.body.className=q.get('bg')||'d';
if(q.get('w'))document.body.style.setProperty('--w',q.get('w')+'px');
fetch('../README.md',{cache:'no-store'}).then(r=>r.text()).then(t=>{
  let html=t.replace(/<!--[\s\S]*?-->/g,'').replace(/\.\/assets\//g,'../assets/');
  if(q.get('s'))html=q.get('s').split(',').map(n=>`<img src="../assets/${n}.svg" width="100%">`).join('');
  const md=document.getElementById('md');md.innerHTML=html;
  if(q.get('y'))md.style.marginTop=-q.get('y')+'px';
});
</script>
